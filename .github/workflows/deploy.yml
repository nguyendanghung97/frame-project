name: Deploy Site

on:
  workflow_dispatch:

jobs:
  build-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            project/package-lock.json
            project-b/package-lock.json
            frame-common/package-lock.json

      - name: Install frame-common dependencies
        run: npm ci
        working-directory: ./frame-common

      - name: Build frame-common
        run: npm run build
        working-directory: ./frame-common

      - name: Install project dependencies
        run: npm ci
        working-directory: ./project

      - name: Build project
        run: npm run build
        working-directory: ./project

      - name: Install project-b dependencies
        run: npm ci
        working-directory: ./project-b

      - name: Build project-b
        run: npm run build
        working-directory: ./project-b

      # =====================================================
      # ASSEMBLE
      #
      # Gom output của các project thành một production site
      # duy nhất để chuẩn bị đưa lên GitHub Pages.
      # =====================================================
      - name: Create deploy-site
        run: |
          mkdir -p deploy-site/project
          mkdir -p deploy-site/project-b

      - name: Assemble project
        run: |
          cp -R project/dist/. deploy-site/project/

      - name: Assemble project-b
        run: |
          cp -R project-b/dist/. deploy-site/project-b/

      # GitHub Pages trả 404.html cho các client-side route không có file vật lý.
      # Giải pháp "spa-github-pages trick":
      #   1. Root 404.html encode path vào query string rồi redirect về đúng index.html.
      #   2. Mỗi index.html có một script decode lại URL để React Router xử lý đúng route.
      - name: Create SPA fallback
        run: |
          # Tạo root 404.html — encode path + redirect về đúng sub-app
          cat > deploy-site/404.html << 'FALLBACK'
          <!DOCTYPE html>
          <html>
          <head>
          <script>
            // Xác định sub-app từ path (project / project-b),
            // sau đó redirect về index.html của sub-app đó với path được encode vào query string.
            var l = window.location;
            var segs = l.pathname.slice(1).split('/');
            // segs[0] = 'frame-project', segs[1] = 'project' | 'project-b'
            var base = '/' + segs[0] + '/' + segs[1] + '/';
            var rest = l.pathname.slice(base.length);
            l.replace(
              l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
              base + '?/' + rest +
              (l.search ? '&' + l.search.slice(1) : '') +
              l.hash
            );
          </script>
          </head>
          <body></body>
          </html>
          FALLBACK

          # Inject decode script vào index.html của từng app.
          # Script này chạy trước React, khôi phục lại URL gốc từ query string
          # để React Router có thể nhận đúng pathname.
          DECODE='<script>(function(l){if(l.search[1]==="/"){var d=l.search.slice(1).split("&").map(function(s){return s.replace(/~and~/g,"&")}).join("?");window.history.replaceState(null,null,l.pathname.slice(0,-1)+d+l.hash)}}(window.location))</script>'

          sed -i "s|<head>|<head>$DECODE|" deploy-site/project/index.html
          sed -i "s|<head>|<head>$DECODE|" deploy-site/project-b/index.html

      # Kiểm tra production output trước khi upload
      - name: Inspect deploy-site
        run: |
          echo "===== deploy-site ====="
          find deploy-site -maxdepth 3 -type f | sort

      # Đóng gói deploy-site thành Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./deploy-site

  # ==========================================================
  # DEPLOY
  #
  # Lấy Pages artifact từ job build-site
  # và publish nó lên GitHub Pages.
  # ==========================================================
  deploy:
    needs: build-site

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployed URLs
        run: |
          BASE="${{ steps.deployment.outputs.page_url }}"
          echo "✅ Deployment successful!"
          echo ""
          echo "🔗 Project URLs:"
          echo "   project   → ${BASE}project/"
          echo "   project-b → ${BASE}project-b/"